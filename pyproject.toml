[project]
name = "music-network"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "glitchingdot", email = "jack@glitching.xyz" }
]
requires-python = ">=3.14"
dependencies = [
    "flake8>=7.5.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "pyvis>=0.3.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
music-network = "music_network:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
